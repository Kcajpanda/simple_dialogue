name: SimpleDialogue
version: ${version}
main: io.github.kcajpanda.simpledialogue.SimpleDialoguePlugin
description: Small YAML dialogue trees for FancyNpcs.
author: Kcajpanda
website: https://github.com/Kcajpanda/simple_dialogue
api-version: "26.1.2"
softdepend:
  - FancyNpcs
commands:
  simpledialogue:
    description: Manage SimpleDialogue conversations.
    usage: /simpledialogue
    aliases:
      - sd
permissions:
  simpledialogue.admin:
    description: Allows editing and reloading dialogue files.
    default: op
